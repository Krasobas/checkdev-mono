apiVersion: apps/v1
kind: Deployment
metadata:
  name: cd-auth-dpl
  namespace: checkdev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cd-auth
  template:
    metadata:
      labels:
        app: cd-auth
    spec:
      containers:
        - name: cd-auth
          image: checkdev/cd_auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9900
          envFrom:
            - configMapRef:
                name: cd-app-config
            - secretRef:
                name: cd-db-credentials
            - secretRef:
                name: cd-app-credentials
          env:
            - name: SERVER_PORT
              value: "9900"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://cd-postgres-svc:5432/cd_auth"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9900
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9900
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: cd-auth-svc
  namespace: checkdev
spec:
  selector:
    app: cd-auth
  ports:
    - port: 9900
      targetPort: 9900