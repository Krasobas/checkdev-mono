# Этот файл — шаблон.
# Реальный 01-secrets.yaml генерируется автоматически:  make secrets
# Или вручную:  cp k8s/01-secrets.example.yaml k8s/01-secrets.yaml

apiVersion: v1
kind: Secret
metadata:
  name: cd-db-credentials
  namespace: checkdev
type: Opaque
stringData:
  POSTGRES_USER: <your-postgres-user>
  POSTGRES_PASSWORD: <your-postgres-password>
  SPRING_DATASOURCE_USERNAME: <your-postgres-user>
  SPRING_DATASOURCE_PASSWORD: <your-postgres-password>
---
apiVersion: v1
kind: Secret
metadata:
  name: cd-app-credentials
  namespace: checkdev
type: Opaque
stringData:
  SECURITY_OAUTH2_CLIENT_CLIENT_ID: <your-oauth2-client-id>
  SECURITY_OAUTH2_CLIENT_CLIENT_SECRET: <your-oauth2-client-secret>
  HH_TOKEN: <your-headhunter-token>
  ACCESS_KEY: <your-access-key>
 